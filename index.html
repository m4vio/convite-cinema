<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite Especial! 🕷️</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #0b1122;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: white;
            text-align: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #e23636;
            box-shadow: 0 0 20px rgba(226, 54, 54, 0.3);
            box-sizing: border-box;
        }
        h1 {
            color: #ff3333;
            font-size: 24px;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        p {
            font-size: 18px;
            margin: 15px 0;
            line-height: 1.5;
        }
        .destaque {
            color: #4ba3ff;
            font-weight: bold;
        }
        /* Esta área agora limita o espaço onde os botões podem se mover */
        .botoes {
            position: relative;
            width: 100%;
            height: 200px; /* Espaço seguro para o botão correr lá dentro */
            margin-top: 25px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.2); /* Fundo sutil para ver a área */
        }
        button {
            padding: 12px 28px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: absolute; /* Ambos agora usam posicionamento controlado */
        }
        #sim {
            background-color: #28a745;
            color: white;
            /* Fixa o botão SIM no lado esquerdo do meio */
            left: 20%;
            top: 50%;
            transform: translateY(-50%);
        }
        #nao {
            background-color: #dc3545;
            color: white;
            /* Posição inicial no lado direito do meio */
            right: 20%;
            top: 50%;
            transform: translateY(-50%);
            transition: 0.12s ease;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>você esta convidado para assistir o filme do homem-aranha comigo!!! 🕷️🕸️</h1>
        
        <p>💥<strong>quando?</strong> amanha as 19h no shopping paralela</p>
        
        <p class="destaque">e melhor: por minha conta!!! 🤑</p>

        <div class="botoes" id="areaBotoes">
            <button id="sim" onclick="aceitou()">Sim!</button>
            <button id="nao" onmouseover="fugir()" onclick="fugir()">Não</button>
        </div>
    </div>

    <script>
        function fugir() {
            var botaoNao = document.getElementById("nao");
            var area = document.getElementById("areaBotoes");
            
            // Remove as propriedades iniciais de alinhamento
            botaoNao.style.right = "auto";
            botaoNao.style.transform = "none";
            
            // Calcula o espaço máximo baseado APENAS na caixinha cinza dos botões
            var larguraMaxima = area.clientWidth - botaoNao.offsetWidth;
            var alturaMaxima = area.clientHeight - botaoNao.offsetHeight;
            
            // Gera a nova posição restrita a esse espaço
            var aleatorioX = Math.floor(Math.random() * larguraMaxima);
            var aleatorioY = Math.floor(Math.random() * alturaMaxima);
            
            // Aplica o movimento dentro da caixa do convite
            botaoNao.style.left = aleatorioX + "px";
            botaoNao.style.top = aleatorioY + "px";
        }

        function aceitou() {
            alert("sabia que voce nao ia recusar bb, te vejo la!! 🍿🎬");
        }
    </script>

</body>
</html>
