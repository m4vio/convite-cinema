<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite Especial! 🕷️</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #0b1122;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: white;
            text-align: center;
        }
        .container {
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #e23636;
            box-shadow: 0 0 20px rgba(226, 54, 54, 0.3);
        }
        h1 {
            color: #ff3333;
            font-size: 24px;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        p {
            font-size: 18px;
            margin: 15px 0;
            line-height: 1.5;
        }
        .destaque {
            color: #4ba3ff;
            font-weight: bold;
        }
        .botoes {
            position: relative;
            width: 100%;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-top: 20px;
        }
        button {
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #sim {
            background-color: #28a745;
            color: white;
        }
        #nao {
            background-color: #dc3545;
            color: white;
            position: absolute;
            transition: 0.1s ease;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>você esta convidado para assistir o filme do homem-aranha comigo!!! 🕷️🕸️</h1>
        
        <p>💥<strong>quando?</strong> amanha as 19h no shopping paralela</p>
        
        <p class="destaque">e melhor: por minha conta!!! 🤑</p>

        <div class="botoes">
            <button id="sim" onclick="aceitou()">Sim!</button>
            <button id="nao" onmouseover="fugir()" onclick="fugir()">Não</button>
        </div>
    </div>

    <script>
        function fugir() {
            var botaoNao = document.getElementById("nao");
            
            var larguraJanela = window.innerWidth - 120;
            var alturaJanela = window.innerHeight - 80;
            
            var aleatorioX = Math.max(10, Math.random() * larguraJanela);
            var aleatorioY = Math.max(10, Math.random() * alturaJanela);
            
            botaoNao.style.left = aleatorioX + "px";
            botaoNao.style.top = aleatorioY + "px";
        }

        function aceitou() {
            alert("sabia que nao iria recusar bb!! 🍿🎬");
        }
    </script>

</body>
</html>
